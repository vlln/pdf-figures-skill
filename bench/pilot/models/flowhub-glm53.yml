# 用 flowhub 的 glm-5.3 跑 headless：provider 定义 + 默认模型。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      flowhub:
        displayName: flowhub
        apiKeyEnv: FLOWHUB_API_KEY
        api: openai-completions
        baseURL: https://openapi.flowhub.com.cn/v1
        models:
          - id: glm-5.3
            name: glm-5.3
            contextWindow: 1000000
            input:
              - text
              - image
            # flowhub 网关只认 system/assistant/user/tool，不认 OpenAI 新的 developer 角色
            compat:
              supportsDeveloperRole: false
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: flowhub
    model: glm-5.3
    reasoningEffort: high
